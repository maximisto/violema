name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No deploy, publish, or secret-dependent steps live here by design.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, test, test:platform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # tests/bootstrap.contract.ts asserts that requiring the compiled
        # dist/models.js output (not the TS source) stays free of heavyweight
        # SDK imports at module load. backend/dist is gitignored, so a fresh
        # checkout has no build output until this runs -- without it, that
        # test fails deterministically (MODULE_NOT_FOUND) on every clean CI
        # run even though `npm test` alone never mentions `dist`.
        run: npm run build

      - name: Test
        run: npm test

      - name: Platform tests
        run: npm run test:platform

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Brand-bleed contract test
        # Pure node:fs file-content assertions against the repo's own public/
        # and src/ files -- no dev server, browser, or network involved.
        run: npm run test:brand-bleed

      - name: Integrations contract test
        # Same shape as brand-bleed: reads local source/content files and
        # asserts on their contents. No server, browser, or credentials.
        run: npm run test:integrations
